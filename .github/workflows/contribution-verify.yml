name: Contribution verification
on:
  push:
    branches: [verify/forge-contributions]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ref: [fix/preserve-root-cli-flags, test/non-cuda-vram-probes]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,ingestion-scale]' 'bandit[toml]>=1.7.0,<2.0.0'
          python -m venv "$RUNNER_TEMP/typing"
          "$RUNNER_TEMP/typing/bin/python" -m pip install 'mypy>=1.8.0,<2.0.0'
      - name: Run the complete repository gauntlet
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import subprocess
          doc = pathlib.Path('AGENTS.md').read_text()
          block = doc.split('<!-- gauntlet:begin -->')[1].split('<!-- gauntlet:end -->')[0]
          command = block.split('```bash')[1].split('```')[0].strip()
          command = command.replace('ruff format .', 'ruff format --check .')
          typing = os.path.join(os.environ['RUNNER_TEMP'], 'typing', 'bin', 'python')
          command = command.replace('python3 -m mypy', f'"{typing}" -m mypy')
          subprocess.run(['bash', '-e', '-o', 'pipefail', '-c', command], check=True)
          PY
